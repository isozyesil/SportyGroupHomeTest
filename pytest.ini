[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v -s --tb=short --color=yes
# Explicitly register plugins to ensure they are loaded even if conftest discovery is tricky
# Note: pytest_plugins in ini is not standard, it's usually used in conftest.py or via CLI.
# But we can use the 'plugins' argument in some contexts. 
# For now, having pytest.ini helps define the rootdir.
